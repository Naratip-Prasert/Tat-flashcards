<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แฟลชการ์ดคำศัพท์ญี่ปุ่น</title>
<meta name="theme-color" content="#f6f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea; --ink:#2a2420; --muted:#7c716a; --line:#e3d9cf;
  --card:#fffdf9; --accent:#e5702f; --accent-soft:#fbe6d8;
  --good:#2f8f5b; --good-soft:#dcf1e4; --bad:#c26a1e; --bad-soft:#f9e6d2;
  --new:#8a8fa8; --star:#e8a516;
  --shadow:0 1px 2px rgba(60,40,20,.05),0 4px 14px rgba(60,40,20,.07);
  --shadow2:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.10);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1c1917;--ink:#f3ede7;--muted:#a69a90;--line:#38312c;--card:#26211e;
  --accent:#f08a4b;--accent-soft:#3d2a1f;--good:#5cc28a;--good-soft:#1f3328;--bad:#f0a35e;--bad-soft:#3a2a1c;--new:#9da2bb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow2:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans Thai","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Noto Sans Thai",sans-serif}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.col{max-width:620px;margin:0 auto;width:100%}

/* ---------- top / tabs ---------- */
.top{flex:none;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--line);padding:3px;border-radius:12px}
.tab{border:none;background:transparent;border-radius:10px;padding:5px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab .t1{font-size:14px;font-weight:700}
.tab .t2{font-size:10.5px;color:var(--muted)}
.tab.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab.on .t1{color:var(--accent)}

/* ---------- list view ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 12px 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.ring{flex:none;width:46px;height:46px;position:relative}
.ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.stat .lb{font-size:11.5px;line-height:1.3;color:var(--muted);white-space:nowrap}
@media (min-width:520px){.stat{flex-direction:row;justify-content:center;text-align:left;gap:10px}}
.stat .lb strong{display:block;color:var(--ink);font-size:13px;font-weight:600}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 8px}
.lhead h2{font-size:22px;font-weight:700}
.lhead h2 .jp{color:var(--accent)}
.sort{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;position:relative}
.sort select{appearance:none;-webkit-appearance:none;border:none;background:transparent;font:inherit;color:var(--muted);padding:6px 20px 6px 4px;cursor:pointer;text-align:right}
.sort svg{width:16px;height:16px;position:absolute;right:0;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip .n{color:var(--muted);font-size:11px;margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .n{color:rgba(255,255,255,.8)}
.search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 10px;margin:10px 0 12px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{flex:1;border:none;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:9px 0;outline:none;min-width:0}
.search .clr{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;display:none;padding:0 2px}
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 8px 12px 16px;position:relative;cursor:pointer}
.item .st{position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0}
.item .st.k{background:var(--good)} .item .st.l{background:var(--bad)}
.irow{display:flex;align-items:flex-start;gap:4px}
.itxt{flex:1;min-width:0}
.iw{font-size:19px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.ir{font-size:12.5px;color:var(--muted);margin-top:1px}
.ith{font-size:15.5px;margin-top:8px;line-height:1.4}
.iact{display:flex;gap:0;flex:none}
.ic{width:40px;height:40px;border:none;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.ic svg{width:21px;height:21px}
.ic.star.on{color:var(--star)}
.ic.star.on svg{fill:var(--star)}
.ic.speaking{color:var(--accent)}
.idet{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.55}
.item.open .idet{display:block}
.idet .lbl{font-size:11px;font-weight:600;color:var(--accent);display:block}
.idet div+div{margin-top:6px}
.nores{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}
.lfoot{text-align:center;margin:18px 0 6px}
.link{background:none;border:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer}
.cta{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),var(--bg) 30%)}
.ctabtn{width:100%;height:56px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 18px rgba(229,112,47,.35);display:flex;align-items:center;justify-content:center;gap:8px}
.ctabtn small{font-weight:500;opacity:.85;font-size:13px}
.ctabtn:disabled{opacity:.45;box-shadow:none}

/* ---------- card view ---------- */
.cbar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);flex:none}
.back svg{width:20px;height:20px}
.ctitle{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle b{display:block;color:var(--ink);font-size:15px}
.ibtn{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:700;padding:0}
.ibtn svg{width:17px;height:17px}
.ibtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 12px}
.progress{flex:none;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:4px 0 10px}
.bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.bar i.k{background:var(--good)} .bar i.l{background:var(--bad)}
.stage{flex:1;min-height:0;display:flex;perspective:1400px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{position:relative;flex:1;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow2);border:1px solid var(--line);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 16px 34px;text-align:center;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--card),var(--accent-soft) 260%)}
.tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tag b{color:var(--accent);font-weight:600}
.fact{position:absolute;top:6px;right:6px;display:flex}
.pill{position:absolute;top:50px;right:14px;font-size:11px;padding:2px 8px;border-radius:99px}
.pill.k{background:var(--good-soft);color:var(--good)} .pill.l{background:var(--bad-soft);color:var(--bad)}
.word{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.reading{margin-top:10px;font-size:20px;color:var(--muted);font-weight:500;line-height:1.4}
.thai{font-weight:600;line-height:1.35}
.sub{margin-top:12px;font-size:15px;color:var(--muted);line-height:1.5}
.ex{margin-top:12px;font-size:14px;line-height:1.6;max-width:94%;text-align:left;border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.ex span{display:block;font-size:11px;color:var(--accent);font-weight:600}
.note{margin-top:10px;font-size:13px;line-height:1.5;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:7px 10px;max-width:94%}
.note b{color:var(--accent)}
.hint{position:absolute;bottom:11px;left:0;right:0;font-size:11.5px;color:var(--muted)}
.empty{flex:1;display:none;flex-direction:column;justify-content:center;text-align:center;padding:30px 20px;background:var(--card);border-radius:20px;border:1px solid var(--line)}
.empty h3{font-size:19px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:16px}
.bottom{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.nav{display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:8px}
.nbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;height:56px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.nbtn svg{width:20px;height:20px}
.nbtn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.nbtn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.nbtn:active,.ctabtn:active{transform:scale(.98)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:9}
.toast.show{opacity:1}
@media (max-height:620px){.tab .t2{display:none}.face{padding:42px 14px 26px}.nbtn{height:50px}.ctabtn{height:50px}}
@media (min-width:700px){.card{max-height:460px;align-self:center}.stage{align-items:center}}
</style>
</head>
<body>

<!-- ================= LIST VIEW ================= -->
<section class="view" id="listView">
  <div class="top"><div class="col"><div class="tabs" id="tabs"></div></div></div>
  <div class="scroll" id="scroll"><div class="col">
    <div class="stats" id="stats"></div>
    <div class="lhead">
      <h2 id="lTitle"></h2>
      <label class="sort">
        <select id="sortSel" aria-label="เรียงลำดับ">
          <option value="sheet">ตามชีท</option>
          <option value="star">ติดดาวก่อน</option>
          <option value="weak">ยังไม่จำก่อน</option>
        </select>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      </label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ค้นหาคำศัพท์ / คำอ่าน / คำแปล" autocomplete="off"><button class="clr" id="qclr" aria-label="ล้าง">×</button></div>
    <div class="items" id="items"></div>
    <div class="lfoot"><button class="link" id="resetCh">ล้างสถานะการเรียนของบทนี้</button></div>
  </div></div>
  <div class="cta"><div class="col"><button class="ctabtn" id="studyBtn"></button></div></div>
</section>

<!-- ================= CARD VIEW ================= -->
<section class="view" id="cardView">
  <div class="cbar col">
    <button class="back" id="backBtn" aria-label="กลับไปหน้ารวม"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
    <div class="ctitle" id="cTitle"></div>
    <button class="ibtn" id="dirBtn" aria-label="สลับด้านหน้า"></button>
    <button class="ibtn" id="shufBtn" aria-label="สุ่มลำดับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
    <button class="ibtn" id="hideBtn" aria-label="ซ่อนคำที่จำได้"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="M3 3l18 18"/></svg></button>
  </div>
  <div class="cwrap col">
    <div class="progress"><span id="pos">–</span><div class="bar" id="cbar"><i class="k"></i><i class="l"></i></div><span id="knownCt">–</span></div>
    <div class="stage" id="stage">
      <div class="card" id="card">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="empty" id="empty">
      <h3>จำได้ครบทุกคำในชุดนี้แล้ว 🎉</h3>
      <p>ปิดปุ่ม "ซ่อนคำที่จำได้" เพื่อทบทวนอีกรอบ หรือกลับไปเลือกชุดใหม่</p>
      <button class="nbtn" style="margin:0 auto;padding:0 18px" id="emptyBack">กลับไปหน้ารวม</button>
    </div>
  </div>
  <div class="bottom col">
    <div class="nav" id="nav">
      <button class="nbtn" id="prevBtn" aria-label="ก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="nbtn bad" id="badBtn">ยังไม่จำ</button>
      <button class="nbtn good" id="goodBtn">จำได้แล้ว</button>
      <button class="nbtn" id="nextBtn" aria-label="ถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</section>
<div class="toast" id="toast"></div>

/* ---------- scope & list filtering ---------- */
const inSec = c => c.ch===S.ch && (curSec()==="all"||c.sec===curSec());
const norm = s => s.toLowerCase().replace(/[\s〜~{}（）()・]/g,"");
function listItems(){
  let a = ALL.filter(inSec);
  if(S.starOnly) a=a.filter(c=>stars.has(c.id));
  if(S.stat) a=a.filter(c=>stOf(c)===S.stat);
  if(S.q){ const q=norm(S.q); a=a.filter(c=>norm(c.w+c.r+c.th).includes(q)); }
  const rank={l:0,n:1,k:2};
  if(S.sort==="star") a.sort((x,y)=>(stars.has(y.id)-stars.has(x.id))||x.ord-y.ord);
  if(S.sort==="weak") a.sort((x,y)=>(rank[stOf(x)]-rank[stOf(y)])||x.ord-y.ord);
  return a;
}

    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt); u.lang="ja-JP"; u.rate=0.9; if(jaVoice) u.voice=jaVoice;
    if(btn){ btn.classList.add("speaking"); u.onend=u.onerror=()=>btn.classList.remove("speaking"); }
    speechSynthesis.speak(u);
  }catch(e){ toast("อุปกรณ์นี้เล่นเสียงไม่ได้"); }
}

/* ---------- icons ---------- */
const IC = {
  spk:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`
};

/* ================= LIST VIEW ================= */
function renderTabs(){
  $("tabs").innerHTML = CH.map(c=>`<button class="tab ${c.id===S.ch?"on":""}" data-c="${c.id}">
    <span class="t1"><span style="font-weight:500;font-size:11px">บท ${c.no}</span> <span class="jp">${c.jp}</span></span>
    <span class="t2">${c.th}</span></button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ if(b.dataset.c!==S.ch){ S.ch=b.dataset.c; store.set("fc3-ch",S.ch); S.stat=null; S.starOnly=false; S.q=""; $("q").value=""; setHash(S.ch); renderList(true);} });
}
function ring(n,total,color){
  const r=17, C=2*Math.PI*r, f=total?n/total:0;
  return `<div class="ring"><svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}"/></svg><b>${n}</b></div>`;
}
function renderStats(){
  const scope=ALL.filter(inSec), cnt={n:0,l:0,k:0}; scope.forEach(c=>cnt[stOf(c)]++);
  $("stats").innerHTML=["n","l","k"].map(k=>`<button class="stat ${S.stat===k?"on":""}" data-s="${k}">${ring(cnt[k],scope.length,ST[k].c)}
    <span class="lb"><strong>${ST[k].th}</strong>${cnt[k]} / ${scope.length}</span></button>`).join("");
  $("stats").querySelectorAll(".stat").forEach(b=>b.onclick=()=>{ S.stat = S.stat===b.dataset.s?null:b.dataset.s; renderList(); });
}
function renderChips(){
  const ch=curCh(), items=ALL.filter(c=>c.ch===ch.id);
  const opts=[["all","ทั้งหมด",items.length],...ch.secs.map(s=>[s.id,`<span class="jp">${s.jp}</span> ${s.th}`,s.items.length])];
  const nStar=items.filter(c=>stars.has(c.id)).length;
  $("chips").innerHTML = `<button class="chip ${S.starOnly?"on":""}" id="starChip">★ ติดดาว<span class="n">${nStar}</span></button>` +
    opts.map(([k,l,n])=>`<button class="chip ${curSec()===k?"on":""}" data-k="${k}">${l}<span class="n">${n}</span></button>`).join("");
  $("starChip").onclick=()=>{S.starOnly=!S.starOnly;renderList()};
  $("chips").querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{S.secBy[S.ch]=b.dataset.k;store.set("fc3-sec",S.secBy);renderList()});
}
function itemHtml(c){
  const st=stOf(c);
  const det=(c.ex?`<div><span class="lbl">ตัวอย่าง</span><span class="jp">${esc(c.ex)}</span></div>`:"")+(c.note?`<div><span class="lbl">หมายเหตุ</span>${esc(c.note)}</div>`:"");
  return `<div class="item" data-id="${c.id}">${st!=="n"?`<span class="st ${st}"></span>`:""}
    <div class="irow"><div class="itxt"><div class="iw jp">${esc(c.w)}</div>${c.r?`<div class="ir jp">${esc(c.r)}</div>`:""}</div>
      <div class="iact"><button class="ic spk" aria-label="ฟังเสียง">${IC.spk}</button><button class="ic star ${stars.has(c.id)?"on":""}" aria-label="ติดดาว">${IC.star}</button></div></div>
    <div class="ith">${esc(c.th)}</div>${det?`<div class="idet">${det}</div>`:""}</div>`;
}
function renderList(resetScroll){
  renderTabs(); renderStats(); renderChips();
  const ch=curCh();
  $("lTitle").innerHTML=`<span class="jp">用語</span> <span style="font-size:14px;font-weight:500;color:var(--muted)">คำศัพท์</span>`;
  $("sortSel").value=S.sort;
  const a=listItems();
  $("items").innerHTML = a.length ? a.map(itemHtml).join("") : `<div class="nores">ไม่มีคำที่ตรงกับตัวกรองนี้</div>`;
  const sb=$("studyBtn");
  sb.disabled=!a.length;
  sb.innerHTML=`ทบทวนชุดนี้ <small>· ${a.length} คำ</small>`;
  $("qclr").style.display=S.q?"block":"none";
  if(resetScroll) $("scroll").scrollTop=0;
}
$("items").addEventListener("click",e=>{
  const it=e.target.closest(".item"); if(!it) return;
  const c=ALL.find(x=>x.id===it.dataset.id);
  if(e.target.closest(".spk")){ speak(c,e.target.closest(".spk")); return; }
  if(e.target.closest(".star")){ const b=e.target.closest(".star");
    if(stars.has(c.id)){stars.delete(c.id);b.classList.remove("on")} else {stars.add(c.id);b.classList.add("on")}
    saveStars(); renderChips(); return; }
  it.classList.toggle("open");
});
$("sortSel").onchange=e=>{S.sort=e.target.value;store.set("fc3-sort",S.sort);renderList()};
$("q").oninput=e=>{S.q=e.target.value.trim();renderList()};
$("qclr").onclick=()=>{S.q="";$("q").value="";renderList()};
let armed=false;
$("resetCh").onclick=()=>{
  if(!armed){armed=true;$("resetCh").textContent="แตะอีกครั้งเพื่อยืนยันการล้าง";setTimeout(()=>{armed=false;$("resetCh").textContent="ล้างสถานะการเรียนของบทนี้"},3000);return}
  armed=false;$("resetCh").textContent="ล้างสถานะการเรียนของบทนี้";
  ALL.filter(c=>c.ch===S.ch).forEach(c=>delete status[c.id]); saveStatus(); renderList(); toast("ล้างแล้ว");
};
$("studyBtn").onclick=()=>startStudy();

/* ================= CARD VIEW ================= */
function startStudy(){
  deck=listItems(); if(!deck.length) return;
  const ch=curCh(), sec=ch.secs.find(s=>s.id===curSec());
  const parts=[sec?sec.th:"ทั้งบท"]; if(S.starOnly) parts.push("★ ติดดาว"); if(S.stat) parts.push(ST[S.stat].th); if(S.q) parts.push(`"${S.q}"`);
  studyLabel=`<b>บท ${ch.no} <span class="jp">${ch.jp}</span></b>${esc(parts.join(" · "))}`;
  if(S.hide){ const d=deck.filter(c=>stOf(c)!=="k"); if(d.length) deck=d; }
  if(S.shuffled) shuffle(deck);
  idx=0; showView("cards"); setHash(S.ch+"-cards");
}
function shuffle(d){for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}}
function showView(v){
  S.view=v; $("listView").classList.toggle("on",v==="list"); $("cardView").classList.toggle("on",v==="cards");
  if(v==="cards"){ $("cTitle").innerHTML=studyLabel; renderTools(); show(); } else { try{speechSynthesis.cancel()}catch(e){} renderList(); }
}
function backToList(){ setHash(S.ch); showView("list"); }
$("backBtn").onclick=backToList; $("emptyBack").onclick=backToList;

function wordSize(w){const n=[...w].length; return n<=2?72:n<=4?60:n<=6?48:n<=8?40:n<=11?32:n<=15?27:23}
function thaiSize(t){const n=[...t].length; return n<=8?38:n<=14?32:n<=22?27:n<=30?23:20}
const jpBlock=c=>`<div class="word jp" style="font-size:${wordSize(c.w)}px">${esc(c.w)}</div>`+(c.r?`<div class="reading jp">(${esc(c.r)})</div>`:"");
const thBlock=c=>`<div class="thai" style="font-size:${thaiSize(c.th)}px">${esc(c.th)}</div>`;

function renderTools(){
  $("dirBtn").innerHTML = S.dir==="jp" ? `<span class="jp">あ</span>` : `<span>ก</span>`;
  $("shufBtn").classList.toggle("on",S.shuffled);
  $("hideBtn").classList.toggle("on",S.hide);
}
function show(){
  const has=deck.length>0;
  $("stage").style.display=has?"":"none"; $("nav").style.visibility=has?"":"hidden";
  $("empty").style.display=has?"none":"flex";
  const k=deck.filter(c=>stOf(c)==="k").length, l=deck.filter(c=>stOf(c)==="l").length, n=deck.length||1;
  const bars=$("cbar").children; bars[0].style.width=(k/n*100)+"%"; bars[1].style.width=(l/n*100)+"%";
  $("knownCt").textContent=`จำได้ ${k}/${deck.length}`;
  if(!has){$("pos").textContent="0 / 0";return}
  const c=deck[idx], st=stOf(c);
  $("pos").textContent=`${idx+1} / ${deck.length}`;
  const tag=`<div class="tag"><b class="jp">${esc(c.secJp)}</b>${esc(c.secTh)} · ${c.no}</div>`;
  const act=`<div class="fact"><button class="ic spk" data-a="spk" aria-label="ฟังเสียง">${IC.spk}</button><button class="ic star ${stars.has(c.id)?"on":""}" data-a="star" aria-label="ติดดาว">${IC.star}</button></div>`;
  const pill=st!=="n"?`<div class="pill ${st}">${ST[st].th}</div>`:"";
  const extra=(c.ex?`<div class="ex"><span>ตัวอย่าง</span><span class="jp" style="display:inline;font-size:14px;color:var(--ink);font-weight:400">${esc(c.ex)}</span></div>`:"")+
              (c.note?`<div class="note"><b>หมายเหตุ:</b> ${esc(c.note)}</div>`:"");
  const front=tag+act+pill+(S.dir==="jp"?jpBlock(c):thBlock(c))+`<div class="hint">แตะเพื่อดูคำตอบ</div>`;
  const back=S.dir==="jp"
    ? tag+act+pill+thBlock(c)+`<div class="sub jp">${esc(c.w)}${c.r?" ("+esc(c.r)+")":""}</div>`+extra
    : tag+act+pill+jpBlock(c)+`<div class="sub">${esc(c.th)}</div>`+extra;
  const card=$("card");
  if(flipped){card.style.transition="none";card.classList.remove("flip");void card.offsetWidth;card.style.transition="";flipped=false}
  $("front").innerHTML=front; $("back").innerHTML=back; $("front").scrollTop=0; $("back").scrollTop=0;
}
$("card").addEventListener("click",e=>{
  const a=e.target.closest("[data-a]");
  if(a){ const c=deck[idx];
    if(a.dataset.a==="spk") speak(c,a);
    else { if(stars.has(c.id)) stars.delete(c.id); else stars.add(c.id); saveStars();
      document.querySelectorAll('#card [data-a="star"]').forEach(b=>b.classList.toggle("on",stars.has(c.id)));
      toast(stars.has(c.id)?"ติดดาวแล้ว":"เอาดาวออกแล้ว"); }
    return; }
  flipped=!flipped; $("card").classList.toggle("flip",flipped);
});
function go(n){ if(!deck.length)return; idx=(idx+n+deck.length)%deck.length; show(); }
function mark(ok){
  if(!deck.length)return;
  const c=deck[idx]; status[c.id]=ok?"k":"l"; saveStatus();
  if(S.hide&&ok){ deck.splice(idx,1); if(idx>=deck.length) idx=0; show(); } else go(1);
}
$("prevBtn").onclick=()=>go(-1); $("nextBtn").onclick=()=>go(1);
$("goodBtn").onclick=()=>mark(true); $("badBtn").onclick=()=>mark(false);
$("dirBtn").onclick=()=>{S.dir=S.dir==="jp"?"th":"jp";store.set("fc3-dir",S.dir);renderTools();show();toast(S.dir==="jp"?"ด้านหน้า: ภาษาญี่ปุ่น":"ด้านหน้า: ภาษาไทย")};
$("shufBtn").onclick=()=>{S.shuffled=!S.shuffled; if(S.shuffled) shuffle(deck); else deck.sort((a,b)=>a.ord-b.ord); idx=0; renderTools(); show(); toast(S.shuffled?"สุ่มลำดับแล้ว":"เรียงตามชีท")};
$("hideBtn").onclick=()=>{S.hide=!S.hide;store.set("fc3-hide",S.hide);
  if(S.hide){ const cur=deck[idx]; deck=deck.filter(c=>stOf(c)!=="k"); idx=Math.max(0,deck.indexOf(cur)); }
  else { const cur=deck[idx]; deck=listItems(); if(S.shuffled) shuffle(deck); idx=Math.max(0,deck.indexOf(cur)); }
  renderTools(); show(); toast(S.hide?"ซ่อนคำที่จำได้แล้ว":"แสดงทุกคำ")};
document.addEventListener("keydown",e=>{
  if(S.view!=="cards") return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flipped=!flipped;$("card").classList.toggle("flip",flipped)}
  else if(e.key==="ArrowRight")go(1); else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="1")mark(false); else if(e.key==="2")mark(true); else if(e.key==="Escape")backToList();
});
let sx=null,sy=null;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("stage").addEventListener("touchend",e=>{
  if(sx==null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){e.preventDefault();go(dx<0?1:-1)}
});
window.addEventListener("hashchange",()=>{ const h=parseHash(); if(!h) return;
  if(h.ch!==S.ch){S.ch=h.ch;store.set("fc3-ch",S.ch)}
  if(h.cards && S.view!=="cards") startStudy(); else if(!h.cards && S.view!=="list") showView("list"); else renderList(true); });

/* ---------- boot ---------- */
(function(){ const h=parseHash(); if(h){S.ch=h.ch;store.set("fc3-ch",S.ch)} showView("list"); if(h&&h.cards) startStudy(); else setHash(S.ch); })();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
